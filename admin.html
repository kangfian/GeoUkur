<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Admin Darurat — GeoUkur</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="./css/style.css">
<style>body{height:auto;min-height:100%}.ah{display:flex;gap:10px;align-items:center;padding:10px 16px;background:#fff;border-bottom:2px solid #0F172A;position:sticky;top:0;z-index:20}.ah .sec{margin-left:auto;min-height:42px}
.ah .t1{font:800 18px var(--f);letter-spacing:-.02em}.ah small{display:block;font:700 10.5px var(--f);letter-spacing:.1em}
.warn{background:#FEF3C7;border:2px solid #92400E;border-radius:10px;padding:11px 13px;margin-bottom:14px}
#login{min-height:calc(100dvh - 70px);display:flex;align-items:center}#login .box{width:100%;max-width:420px;margin:0 auto;padding:22px 20px;border-radius:18px;box-shadow:0 4px 0 var(--line)}
#login .logo{margin:0 auto 12px;width:52px;height:52px;display:grid}#login h3{text-align:center;margin:0 0 2px;font:800 22px var(--f);letter-spacing:-.02em}#login p{text-align:center;margin:0 0 6px;font-size:13px}
#emap{height:46vh;min-height:260px;border:2px solid #0F172A;border-radius:12px;margin-top:10px}.vx.sel::after{border-color:#EF4444}
.item{border:2px solid #0F172A;border-radius:14px;background:#fff;padding:12px 14px;margin-top:12px;box-shadow:0 3px 0 var(--line)}.item .a{display:flex;gap:8px;margin-top:10px}.item .a button{flex:1;min-height:44px}
.sheet{max-height:94dvh}details.box summary{min-height:34px}</style></head>
<body>
<div class="ah"><span class="logo"><svg viewBox="0 0 24 24"><path d="M4.5 8.5L10 4l9.5 4.5-1.5 10L7 20z"/><circle cx="10" cy="4" r="1.6"/><circle cx="19.5" cy="8.5" r="1.6"/><circle cx="18" cy="18.5" r="1.6"/><circle cx="7" cy="20" r="1.6"/></svg></span><div><div class="t1">GeoUkur Admin</div><small>AKSES DARURAT</small></div><button id="out" class="sec" hidden>Keluar</button></div>

<div class="pad" id="login"><div class="box"><span class="logo"><svg viewBox="0 0 24 24"><path d="M4.5 8.5L10 4l9.5 4.5-1.5 10L7 20z"/><circle cx="10" cy="4" r="1.6"/><circle cx="19.5" cy="8.5" r="1.6"/><circle cx="18" cy="18.5" r="1.6"/><circle cx="7" cy="20" r="1.6"/></svg></span><h3>Masuk Admin</h3><p>Khusus untuk mengedit atau menghapus data lahan.</p>
 <label>Nama pengguna<input id="u" autocomplete="username" autocapitalize="off"></label>
 <label>Kata sandi<input id="p" type="password" autocomplete="current-password"></label>
 <button class="pri full" id="in">Masuk</button><div class="err" id="lerr"></div></div></div>

<div class="pad" id="panel" hidden>
 <div class="warn" id="wg" hidden><b>Segera ganti kata sandi awal.</b> Buka "Ganti kata sandi" di bawah.</div>
 <input id="q" placeholder="Cari petani, blok, atau kelompok…"><div class="sum mono" id="sum"></div><div id="list"></div>
 <details class="box" style="margin-top:16px"><summary><b>Ganti kata sandi</b></summary>
  <label>Kata sandi lama<input id="g1" type="password" autocomplete="current-password"></label>
  <label>Kata sandi baru (min. 12 karakter, huruf + angka)<input id="g2" type="password" autocomplete="new-password"></label>
  <button class="sec full" id="gok">Ganti kata sandi</button></details>
</div>

<div id="sheet" class="sheet"><div class="sh-in"><div class="row"><h2>Edit Lahan</h2><button id="e-x" class="x" aria-label="Tutup"></button></div>
 <div class="box sm"><div class="mono" id="e-sum"></div></div>
 <label>Kelompok Tani *<input id="e-kt"></label><label>Nama Petani *<input id="e-np"></label><label>Nama / Blok Lahan<input id="e-nl"></label><label>Catatan<textarea id="e-ct" rows="2"></textarea></label>
 <label style="margin-top:14px">Bentuk poligon — geser titik, ketuk titik tengah untuk menambah sudut</label><div id="emap"></div>
 <div class="acts"><button id="e-dp" class="sec">Hapus titik terpilih</button><button id="e-rs" class="sec">Kembalikan bentuk</button></div>
 <div class="err" id="e-err"></div>
 <button class="pri full" id="e-ok">Simpan perubahan</button></div></div>
<div id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="./js/config.js"></script><script src="./js/admin.js"></script></body></html>
